# Netlify deployment for OpeniWatch.
#
# The application is a static single-page app. All server-side work — signal
# ingestion, notification dispatch — runs in Supabase Edge Functions, so no
# Netlify Functions are required and no secret is ever available to this build
# beyond the VITE_-prefixed, browser-safe values.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Service workers must never be rewritten to index.html by the SPA fallback
# below. A worker served as HTML fails to register, and the failure reads as
# "push does not work" rather than as a routing problem. These come first
# because Netlify applies the first matching rule.
[[redirects]]
  from = "/OneSignalSDKWorker.js"
  to = "/OneSignalSDKWorker.js"
  status = 200
  force = false

[[redirects]]
  from = "/sw.js"
  to = "/sw.js"
  status = 200
  force = false

[[redirects]]
  from = "/manifest.webmanifest"
  to = "/manifest.webmanifest"
  status = 200
  force = false

# SPA fallback: client-side routes such as /alerts/<id> must serve index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), usb=()"
    # Source items are attacker-controlled text. The app renders them as text
    # only and never with dangerouslySetInnerHTML, and this policy is the
    # backstop. 'unsafe-inline' for styles is required by the CSS-variable
    # theming; scripts are restricted to same-origin.
    # script-src allows the OneSignal SDK, which is loaded from their CDN only
    # after an operator opts in to web push. worker-src covers the service
    # worker OneSignal registers. connect-src covers Supabase REST, Realtime
    # (wss) and the OneSignal API.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.onesignal.com; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://*.onesignal.com https://onesignal.com; frame-src https://*.onesignal.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"

# Two service workers, separated by scope so they never contend for a single
# registration:
#
#   /sw.js                   scope "/"           application shell + install
#   /OneSignalSDKWorker.js   scope "/onesignal/" vendor push worker, verbatim
#
# Both must be served from the application origin, unauthenticated, without a
# redirect, and as JavaScript. The SPA fallback below would otherwise rewrite
# them to index.html, which is why each has an explicit passthrough.

[[headers]]
  for = "/OneSignalSDKWorker.js"
  [headers.values]
    # Not strictly needed for the "/onesignal/" scope, which is narrower than
    # this file's own path allows. Kept so the scope can be widened later
    # without a header change being the thing that silently breaks push.
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Service-Worker-Allowed = "/"
    Cache-Control = "no-cache"
    Content-Type = "application/javascript"

# The manifest must be readable by the browser's install machinery and must not
# be cached past a deploy, or an icon or name change never takes effect.
[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"

# Hashed build assets are immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The entry document must never be cached, so a deploy takes effect at once.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
