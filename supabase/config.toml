# Supabase local development configuration.
#
# Run `supabase start` to bring up a local stack, then `supabase db reset` to
# apply every migration in supabase/migrations in order.

project_id = "openiwatch"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

# All three functions authenticate callers themselves, with a shared secret in
# the x-openiwatch-secret header compared in constant time. None of them expects
# a user JWT: the ingest endpoint is called by a collector, and the other two by
# a scheduler. Leaving verify_jwt on would make Supabase reject those callers
# before the function ran, which reads as "the function is broken" rather than
# as an auth-gateway setting.
[functions.ingest-signal]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.escalate-unacknowledged]
verify_jwt = false
