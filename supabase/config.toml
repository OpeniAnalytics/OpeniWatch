# Supabase local development configuration.
#
# Run `supabase start` to bring up a local stack, then `supabase db reset` to
# apply every migration in supabase/migrations in order.

project_id = "openiwatch"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[realtime]
enabled = true

# The ingest endpoint authenticates with its own shared secret rather than a
# Supabase JWT, so the platform's JWT verification is disabled for it.
[functions.ingest-signal]
verify_jwt = false
